<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Standalone fallbacks for the shipped theme tokens the track uses. */
  :root {
    --dsw-alias-bg-layer-2: #e5e7eb;
    --dsw-alias-brand-primary: #2a6bff;
  }
  body { margin: 0; padding: 24px; background: #101318; font-family: system-ui, sans-serif; }
  .demo-row { width: 320px; display: grid; grid-template-columns: 1fr auto; align-items: center; row-gap: 8px; padding: 8px; }
  .demo-label { font-size: 14px; color: #cbd5e1; }
  .demo-value { font-size: 14px; color: #93c5fd; }
  /* ---- EXACT rules from src/client/thinking-depth/shared.js (values substituted) ---- */
  .dshp-eff-slider { position: relative; box-sizing: border-box; width: 100%; height: 28px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dshp-eff-ghost { position: absolute; left: 0; right: 0; top: 50%; height: 28px; margin-top: -14px; border-radius: 14px; background-color: var(--dsw-alias-bg-layer-2); background-repeat: no-repeat; background-size: 100% 100%; }
  .dshp-eff-fill { position: absolute; left: 0; top: 50%; height: 28px; margin-top: -14px; border-radius: 14px; }
  .dshp-eff-stop { position: absolute; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: rgba(255,255,255,.72); pointer-events: none; }
  .dshp-eff-knob { position: absolute; top: 50%; width: 20px; height: 20px; margin-top: -10px; transform: translateX(-50%); border-radius: 50%; background: #fff; pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
</style>
</head>
<body>
  <div class="demo-row">
    <span class="demo-label">推理等级</span>
    <span class="demo-value">High</span>
    <div class="dshp-eff-slider" style="grid-area: 2 / 1 / 3 / 3;">
      <span class="dshp-eff-ghost"></span>
      <span class="dshp-eff-fill" style="width: calc(14px + (100% - 28px) * 0.6); background-color: #4e53fa;"></span>
      <span class="dshp-eff-stop" style="left: calc(14px + (100% - 28px) * 0);"></span>
      <span class="dshp-eff-stop" style="left: calc(14px + (100% - 28px) * 0.2);"></span>
      <span class="dshp-eff-stop" style="left: calc(14px + (100% - 28px) * 0.4);"></span>
      <span class="dshp-eff-stop" style="left: calc(14px + (100% - 28px) * 0.6);"></span>
      <span class="dshp-eff-stop" style="left: calc(14px + (100% - 28px) * 0.8);"></span>
      <span class="dshp-eff-stop" style="left: calc(14px + (100% - 28px) * 1);"></span>
      <span class="dshp-eff-knob" style="left: calc(14px + (100% - 28px) * 0.6); box-shadow: 0 0 0 3px #4e53fa33, 0 1px 4px rgba(0,0,0,.35);"></span>
    </div>
  </div>
</body>
</html>
